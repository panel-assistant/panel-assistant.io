version: 2
# Aligned with panel-assistant/android and ha-integration: weekly, grouped, with a 7-day
# cooldown so a freshly published (and possibly compromised) release is never proposed on
# its first days. Security updates are not held by the cooldown.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  # The site build (Astro) and its tooling. Add a directory entry here when another
  # package.json arrives, for example the screen-capture tooling.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      site-dependencies:
        patterns:
          - '*'
    # @astrojs/check declares typescript ^5 || ^6 as a peer; a major typescript bump fails npm ci
    # (ERESOLVE) until it widens that range.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  # The wrangler the deploy job runs (.github/wrangler), kept apart from the site's packages so
  # the build does not install it.
  - package-ecosystem: npm
    directory: /.github/wrangler
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
