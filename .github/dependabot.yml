version: 2
# Aligned with panel-assistant/android and ha-integration: weekly, grouped, with a 7-day
# cooldown so a freshly published (and possibly compromised) release is never proposed on
# its first days. Security updates are not held by the cooldown.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  # The site build (Astro) and its tooling. Add a directory entry here when another
  # package.json arrives, for example the screen-capture tooling.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      site-dependencies:
        patterns:
          - '*'
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
