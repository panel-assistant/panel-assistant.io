name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The site sends nothing to anyone at runtime, and its build should not either.
  ASTRO_TELEMETRY_DISABLED: '1'
  # Only a build of main is a numbered release of the site; see src/build-info.
  BUILD_CHANNEL: ${{ github.ref == 'refs/heads/main' && 'main' || 'preview' }}

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled, but a push to main is never
  # interrupted: that run can be part-way through publishing the site.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Format, check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pages carry a last-updated date taken from their own commit history,
          # which a shallow clone would collapse onto the CI run.
          fetch-depth: 0

      - name: Restore firmware history and archive state
        run: |
          git fetch --no-tags origin \
            +refs/heads/firmware-status:refs/remotes/origin/firmware-status \
            +refs/heads/wayback-state:refs/remotes/origin/wayback-state
          git update-ref refs/heads/firmware-status refs/remotes/origin/firmware-status
          git update-ref refs/heads/wayback-state refs/remotes/origin/wayback-state

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Test firmware monitors
        run: python -m unittest discover -s tools/firmware-index -p 'test_*.py'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check content and types
        run: npm run check

      # Internal links are validated during the build, so a broken one fails here.
      - name: Build
        run: npm run build

      # The /go redirect table is checked against the pages this build produced,
      # so a topic can never point at a page or anchor that does not exist.
      - name: Test the redirect router
        run: npm test

      # The deploy job publishes this exact directory, so what goes live is the
      # output these checks passed over rather than a second, unverified build.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        with:
          name: site
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Publish to Cloudflare
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Holds CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Keeping them on a
    # protected environment rather than in repository secrets means the checks
    # above can never reach the publishing credential.
    environment:
      name: cloudflare
    # A publish is not safe to interrupt part-way, so this never cancels itself.
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false
    steps:
      # worker/wrangler.jsonc names the assets directory and the Worker script,
      # so the repository is needed alongside the built output.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist

      - name: Publish
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Workers Static Assets, which Cloudflare recommends over Pages for new
          # projects. The name and the assets directory come from worker/wrangler.jsonc.
          command: deploy --config worker/wrangler.jsonc

      # A data-branch rebuild keeps the same main SHA, so verify both data refs
      # as well as the code commit before calling the daily publish complete.
      - name: Verify the live build
        run: |
          expected=$(node -p 'JSON.stringify(((b) => [b.sha, b.firmwareStatus, b.waybackState])(require("./dist/build.json")))')
          if [[ "$expected" == *null* ]]; then
            echo "::error::The built site lacks a firmware history or archive ref."
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            live=$(curl -fsS --max-time 20 "https://panel-assistant.io/build.json?attempt=${attempt}" | node -e 'const b=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(JSON.stringify([b.sha,b.firmwareStatus,b.waybackState]))') || live=""
            if [ "$live" = "$expected" ]; then
              echo "live site reports the built code and firmware data refs"
              exit 0
            fi
            echo "attempt $attempt: live code or firmware data refs have not changed yet"
            sleep 10
          done
          exit 1
