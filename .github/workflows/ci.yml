name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The site sends nothing to anyone at runtime, and its build should not either.
  ASTRO_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Format, check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pages carry a last-updated date taken from their own commit history,
          # which a shallow clone would collapse onto the CI run.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check content and types
        run: npm run check

      # Internal links are validated during the build, so a broken one fails here.
      - name: Build
        run: npm run build
